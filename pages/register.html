<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mangateca — Crear cuenta</title>
    <meta name="description" content="Crea tu cuenta en Mangateca y empieza a guardar tus favoritos.">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script type="module" src="../src/pages/register.js"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">

    <!-- ── Header ─────────────────────────────────────────────────────────── -->
    <header class="bg-gray-100 shadow-sm border-b border-gray-100">
        <div class="flex items-center justify-between px-8 py-5">

            <a href="../index.html" class="flex items-center gap-3 shrink-0">
                <img src="../assets/icons/favicon.svg" alt="" class="w-10 h-10">
                <h1 class="text-4xl font-extrabold text-gray-900 tracking-tight">Mangateca</h1>
            </a>

            <nav>
                <ul class="flex items-center gap-6 text-sm font-medium text-gray-700 ml-6">
                    <li><a href="../pages/product-list.html" class="hover:text-indigo-600 transition-colors">Lista de Productos</a></li>
                    <li><a href="../pages/books.html" class="hover:text-indigo-600 transition-colors">Libros</a></li>
                    <li><a href="../pages/mangas.html" class="hover:text-indigo-600 transition-colors">Mangas</a></li>
                    <li><a href="../pages/comics.html" class="hover:text-indigo-600 transition-colors">Comics</a></li>
                </ul>
            </nav>

            <nav>
                <ul class="flex items-center gap-5">
                    <li id="user-menu-container"></li>
                    <li>
                        <a href="../pages/wishlist.html" aria-label="Favoritos" class="relative inline-flex">
                            <img src="../assets/icons/favorite.svg" class="w-5 h-5" alt="Icono de favoritos">
                            <span id="wishlist-badge" class="hidden absolute -top-2 -right-2 bg-red-500 text-white text-[10px] font-bold rounded-full min-w-[16px] h-4 flex items-center justify-center px-1 leading-none">0</span>
                        </a>
                    </li>
                    <li>
                        <a href="../pages/cart.html" aria-label="Carrito de compras" class="relative inline-flex">
                            <img src="../assets/icons/shopping-cart.svg" class="w-5 h-5" alt="Icono de carrito de compras">
                            <span id="cart-badge" class="hidden absolute -top-2 -right-2 bg-indigo-600 text-white text-[10px] font-bold rounded-full min-w-[16px] h-4 flex items-center justify-center px-1 leading-none">0</span>
                        </a>
                    </li>
                </ul>
            </nav>

        </div>
    </header>

    <!-- ── Main ───────────────────────────────────────────────────────────── -->
    <main class="flex-1 flex items-center justify-center px-4 py-16">
        <div class="w-full max-w-md">

            <!-- Card -->
            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8">

                <div class="text-center mb-8">
                    <img src="../assets/icons/favicon.svg" alt="" class="w-12 h-12 mx-auto mb-4">
                    <h2 class="text-2xl font-extrabold text-gray-900">Crear cuenta</h2>
                    <p class="text-gray-500 text-sm mt-1">Empieza a guardar tus favoritos</p>
                </div>

                <!-- Error message -->
                <div id="register-error" class="hidden mb-4 px-4 py-3 bg-red-50 text-red-600 text-sm rounded-lg border border-red-100" role="alert"></div>

                <form id="register-form" novalidate class="flex flex-col gap-4">

                    <div class="flex flex-col gap-1.5">
                        <label for="reg-username" class="text-sm font-semibold text-gray-700">Usuario</label>
                        <input
                            type="text"
                            id="reg-username"
                            name="username"
                            autocomplete="username"
                            placeholder="Elige un nombre de usuario"
                            required
                            class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm transition-shadow"
                        >
                    </div>

                    <div class="flex flex-col gap-1.5">
                        <label for="reg-email" class="text-sm font-semibold text-gray-700">Email</label>
                        <input
                            type="email"
                            id="reg-email"
                            name="email"
                            autocomplete="email"
                            placeholder="tu@email.com"
                            required
                            class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm transition-shadow"
                        >
                    </div>

                    <div class="flex flex-col gap-1.5">
                        <label for="reg-password" class="text-sm font-semibold text-gray-700">Contraseña</label>
                        <input
                            type="password"
                            id="reg-password"
                            name="password"
                            autocomplete="new-password"
                            placeholder="Mínimo 6 caracteres"
                            required
                            class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm transition-shadow"
                        >
                    </div>

                    <div class="flex flex-col gap-1.5">
                        <label for="reg-confirm" class="text-sm font-semibold text-gray-700">Confirmar contraseña</label>
                        <input
                            type="password"
                            id="reg-confirm"
                            name="confirm"
                            autocomplete="new-password"
                            placeholder="Repite tu contraseña"
                            required
                            class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm transition-shadow"
                        >
                    </div>

                    <button
                        type="submit"
                        id="register-submit"
                        class="mt-2 w-full bg-indigo-600 text-white font-bold py-3.5 rounded-xl hover:bg-indigo-700 transition-colors shadow-md hover:shadow-lg disabled:opacity-60 disabled:cursor-not-allowed"
                    >
                        Crear cuenta
                    </button>

                </form>

                <p class="text-center text-sm text-gray-500 mt-6">
                    ¿Ya tienes cuenta?
                    <a href="../pages/login.html" class="text-indigo-600 font-semibold hover:underline">Inicia sesión</a>
                </p>

            </div>
        </div>
    </main>

    <!-- ── Footer ─────────────────────────────────────────────────────────── -->
    <footer class="bg-[#4FB59B] text-white/80">
        <div class="border-t border-white/20">
            <p class="max-w-7xl mx-auto px-6 py-4 text-center">
                <small class="text-white/60">&copy; 2026 Mangateca. Todos los derechos reservados.</small>
            </p>
        </div>
    </footer>

</body>
</html>
