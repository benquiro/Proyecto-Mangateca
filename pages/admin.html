<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mangateca — Panel de Administración</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script type="module" src="../src/pages/admin.js"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col text-gray-900">

    <!-- ── Header ─────────────────────────────────────────────────────────── -->
    <header class="bg-gray-100 shadow-sm border-b border-gray-100 sticky top-0 z-40">
        <div class="flex items-center justify-between px-8 py-5">
            <a href="../index.html" class="flex items-center gap-3 shrink-0">
                <img src="../assets/icons/favicon.svg" alt="" class="w-10 h-10">
                <h1 class="text-4xl font-extrabold tracking-tight">Mangateca</h1>
            </a>
            
            <div class="flex items-center gap-4">
                <span class="bg-indigo-100 text-indigo-700 px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wide">
                    Panel Admin
                </span>
                <nav>
                    <ul class="flex items-center gap-5">
                        <li id="user-menu-container"></li>
                    </ul>
                </nav>
            </div>
        </div>
    </header>

    <!-- ── Main ───────────────────────────────────────────────────────────── -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-6 py-10">
        
        <div class="mb-8 flex items-center justify-between">
            <div>
                <h2 class="text-3xl font-extrabold mb-2">Administración</h2>
                <p class="text-gray-500">Gestioná el catálogo de productos y los usuarios registrados.</p>
            </div>
        </div>

        <!-- Tabs Navigation -->
        <div class="border-b border-gray-200 mb-8">
            <nav class="flex gap-8" aria-label="Tabs">
                <button id="tab-products" class="border-indigo-600 text-indigo-600 border-b-2 py-4 px-1 text-sm font-semibold transition-colors">
                    Gestión de Productos
                </button>
                <button id="tab-users" class="border-transparent text-gray-500 hover:text-gray-700 border-b-2 py-4 px-1 text-sm font-semibold transition-colors">
                    Gestión de Usuarios
                </button>
            </nav>
        </div>

        <!-- Section: Products -->
        <section id="section-products">
            <div class="flex items-center justify-between mb-6">
                <h3 class="text-xl font-bold">Catálogo</h3>
                <button id="btn-add-product" class="bg-indigo-600 text-white font-bold px-5 py-2.5 rounded-xl shadow-sm hover:bg-indigo-700 transition-colors flex items-center gap-2">
                    <span class="text-lg leading-none">+</span> Agregar Producto
                </button>
            </div>
            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
                <div id="products-table-container">
                    <!-- Inyectado por admin.js -->
                </div>
            </div>
        </section>

        <!-- Section: Users -->
        <section id="section-users" class="hidden">
            <div class="flex items-center justify-between mb-6">
                <h3 class="text-xl font-bold">Usuarios</h3>
                <button id="btn-add-user" class="bg-indigo-600 text-white font-bold px-5 py-2.5 rounded-xl shadow-sm hover:bg-indigo-700 transition-colors flex items-center gap-2">
                    <span class="text-lg leading-none">+</span> Agregar Usuario
                </button>
            </div>
            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
                <div id="users-table-container">
                    <!-- Inyectado por admin.js -->
                </div>
            </div>
        </section>

    </main>

    <!-- ── Modal Backdrop ─────────────────────────────────────────────────── -->
    <div id="admin-modal" class="hidden fixed inset-0 z-50 bg-gray-900/40 backdrop-blur-sm items-center justify-center p-4 opacity-100 transition-opacity">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl max-h-[90vh] flex flex-col overflow-hidden" onclick="event.stopPropagation()">
            
            <div class="px-6 py-4 border-b border-gray-100 flex items-center justify-between bg-gray-50/50">
                <h3 id="modal-title" class="text-xl font-bold">Título Modal</h3>
                <button id="modal-close" class="text-gray-400 hover:text-gray-700 transition-colors text-2xl leading-none">&times;</button>
            </div>
            
            <div id="modal-body" class="p-6 overflow-y-auto">
                <!-- Inyectado por JS -->
            </div>

        </div>
    </div>

</body>
</html>
